name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "taletool"))'
          )"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi

          if [[ "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-release-validation-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-release-validation-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/taletool
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/taletool.exe
            extension: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-release-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --locked --package taletool --target ${{ matrix.target }}

      - name: Smoke-test release binary
        shell: bash
        run: '"./${{ matrix.binary }}" --help'

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          package_name="taletool-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp "${{ matrix.binary }}" README.md LICENSE NOTICE.md "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageName = "taletool-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          $packageDirectory = Join-Path dist $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "${{ matrix.binary }}", README.md, LICENSE, NOTICE.md -Destination $packageDirectory
          Compress-Archive -Path $packageDirectory -DestinationPath "dist/$packageName.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/taletool-${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum taletool-* > SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail

          options=(--verify-tag --generate-notes)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            options+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" dist/taletool-* dist/SHA256SUMS "${options[@]}"
